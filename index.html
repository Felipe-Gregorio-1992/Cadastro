<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de Vendas</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: left;
        }

        .form-container h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .form-container label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }

        .form-container input,
        .form-container select,
        .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-container button {
            background-color: #25d366;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .form-container button:hover {
            background-color: #1ebd50;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Interesses</h2>
        <form id="salesForm">
            <label for="clientName">Nome do Cliente: *</label>
            <input type="text" id="clientName" name="clientName" required>

            <label for="productType">Tipo de Produto (Casa, Moto, Carro, Outros): *</label>
            <input type="text" id="productType" name="productType" required>

            <label for="financing">Modalidade Preferida (Avista ou Parcelado): *</label>
            <select id="financing" name="financing" required onchange="toggleFields()">
                <option value="Avista">Avista</option>
                <option value="Parcelado">Parcelado</option>
            </select>

            <div id="valorEntradaDiv">
                <label for="investment">Valor disponível para entrada: *</label>
                <input type="number" id="investment" name="investment" required>
            </div>

            <div id="valorParceladoDiv">
                <label for="investment-parcela">Valor disponível para parcela: *</label>
                <input type="number" id="investment-parcela" name="investment-parcela" required>
            </div>

            <label for="city">Cidade: *</label>
            <input type="text" id="city" name="city" required>


            <label for="availability">Disponibilidade para visita:</label>
            <textarea id="availability" name="availability" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        function toggleFields() {
            var financing = document.getElementById("financing").value;
            var valorEntradaDiv = document.getElementById("valorEntradaDiv");
            var valorParceladoDiv = document.getElementById("valorParceladoDiv");

            if (financing === "Avista") {
                valorEntradaDiv.style.display = "none"; // Esconde o campo de valor de entrada
                valorParceladoDiv.style.display = "none"; // Esconde o campo de valor de parcela
                document.getElementById("investment").removeAttribute("required"); // Remove o required do valor de entrada
                document.getElementById("investment-parcela").removeAttribute("required"); // Remove o required do valor de parcela
            } else {
                valorEntradaDiv.style.display = "block"; // Mostra o campo de valor de entrada
                valorParceladoDiv.style.display = "block"; // Mostra o campo de valor de parcela
                document.getElementById("investment").setAttribute("required", "true"); // Adiciona o required no valor de entrada
                document.getElementById("investment-parcela").setAttribute("required", "true"); // Adiciona o required no valor de parcela
            }
        }

        // Chama a função inicialmente para garantir o estado correto dos campos
        toggleFields();

        document.getElementById('salesForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const clientName = document.getElementById('clientName').value;
            const productType = document.getElementById('productType').value;
            const city = document.getElementById('city').value;
            const investment = document.getElementById('investment').value;
            const financing = document.getElementById('financing').value;
            const availability = document.getElementById('availability').value;
            const investmentparcela = document.getElementById('investment-parcela').value;

            const formattedMessage = `Nome: *${clientName}*`;
            const formattedMessage2 = `Produto: *${productType}*`;
            const formattedMessage3 = `Cidade: *${city}*`; 
            const formattedMessage4 = `Valor de Entrada: *${investment}*`;
            const formattedMessage8 = `Valor de Parcela: *${investmentparcela}*`;
            const formattedMessage5 = `Modalidade: *${financing}*`; 
            const formattedMessage7 = `Disponibilidade: *${availability}*`;

            const teste = formattedMessage + '\n' + formattedMessage2 + '\n' + formattedMessage3 + '\n' + formattedMessage4 + '\n' + formattedMessage8 + '\n' + formattedMessage5 + '\n' + formattedMessage7;

            const myPhoneNumber = 'SEU_NUMERO_DE_TELEFONE';
            const whatsappURL = `https://api.whatsapp.com/send?phone=55${9484178273}&text=${encodeURIComponent(teste)}`;
            
            window.open(whatsappURL, '_blank');
        });
    </script>

</body>
</html>
